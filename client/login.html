<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — Nodalis</title><link rel="stylesheet" href="/css/luxury.css"></head><body>
<div class="auth-page"><div class="auth-card">
<div class="logo-area"><img src="/assets/logo/nodalis-logo.png" alt="Nodalis"></div>
<h2>Welcome Back</h2><p class="subtitle">Sign in to your Nodalis account</p>
<form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div><div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
<button type="submit" class="btn-luxury btn-dark" style="width:100%;justify-content:center;">Sign In</button></form>
<p class="auth-switch">Don't have an account? <a href="/client/register.html">Create one</a></p>
</div></div>
<script src="/js/script.js"></script>
<script>document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var email=document.getElementById('loginEmail').value;var password=document.getElementById('loginPassword').value;try{var res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});var data=await res.json();if(res.ok){localStorage.setItem('nodalis_token',data.token);localStorage.setItem('nodalis_user',JSON.stringify(data.user));showToast('Welcome back!','success');setTimeout(function(){if(data.user.role==='admin'){window.location.href='/admin/dashboard.html';}else{window.location.href='/';}},1000);}else{showToast(data.message||'Login failed','error');}}catch{showToast('Server error','error');}});</script></body></html>
