<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register — Nodalis</title><link rel="stylesheet" href="/css/luxury.css"></head><body>
<div class="auth-page"><div class="auth-card">
<div class="logo-area"><img src="/assets/logo/nodalis-logo.png" alt="Nodalis"></div>
<h2>Create Account</h2><p class="subtitle">Join the Nodalis community</p>
<form id="registerForm"><div class="form-row"><div class="form-group"><label>First Name</label><input type="text" id="regFirst" required></div><div class="form-group"><label>Last Name</label><input type="text" id="regLast" required></div></div>
<div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div><div class="form-group"><label>Password</label><input type="password" id="regPassword" required minlength="6"></div>
<button type="submit" class="btn-luxury btn-dark" style="width:100%;justify-content:center;">Create Account</button></form>
<p class="auth-switch">Already have an account? <a href="/client/login.html">Sign in</a></p>
</div></div>
<script src="/js/script.js"></script>
<script>document.getElementById('registerForm').addEventListener('submit',async function(e){e.preventDefault();var data={firstName:document.getElementById('regFirst').value,lastName:document.getElementById('regLast').value,email:document.getElementById('regEmail').value,password:document.getElementById('regPassword').value};try{var res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});var result=await res.json();if(res.ok){localStorage.setItem('nodalis_token',result.token);localStorage.setItem('nodalis_user',JSON.stringify(result.user));showToast('Welcome to Nodalis!','success');setTimeout(function(){window.location.href='/';},1000);}else{showToast(result.message||'Registration failed','error');}}catch{showToast('Server error','error');}});</script></body></html>
