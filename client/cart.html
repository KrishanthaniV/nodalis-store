<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Nodalis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" id="mainNav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><img src="/assets/logo/nodalis-logo.png" alt="Nodalis" style="height: 50px; width: auto; object-fit: contain;"></a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/client/shop.html">Shop</a>
        <a href="/client/about.html">About</a>
        <a href="/client/contact.html">Contact</a>
      </div>
      <div class="nav-icons">
        <a href="/client/login.html" class="nav-icon" title="Account">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a href="/client/cart.html" class="nav-icon" title="Cart" id="cartIcon">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="nav-mobile" id="navMobile">
      <a href="/">Home</a><a href="/client/shop.html">Shop</a><a href="/client/about.html">About</a><a href="/client/contact.html">Contact</a>
    </div>
  </nav>

  <!-- Cart Page -->
  <section class="cart-page">
    <div class="container">
      <h1 style="margin-bottom: var(--space-2xl);">Your Cart</h1>

      <div id="cartContent">
        <!-- Populated by JS -->
      </div>

      <div id="cartEmpty" class="cart-empty hidden">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <h2>Your cart is empty</h2>
        <p style="margin: var(--space-md) auto var(--space-xl);">Looks like you haven't added any pieces yet.</p>
        <a href="/client/shop.html" class="btn btn-primary">Browse Collection</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Nodalis. All rights reserved.</p>
        <p>Handmade with ♥</p>
      </div>
    </div>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/script.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCartPage);

    function renderCartPage() {
      const cart = getCart();
      const content = document.getElementById('cartContent');
      const empty = document.getElementById('cartEmpty');

      if (cart.length === 0) {
        content.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      content.classList.remove('hidden');
      empty.classList.add('hidden');

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const shipping = subtotal > 100 ? 0 : 8.50;
      const total = subtotal + shipping;

      content.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${cart.map((item, i) => `
              <div class="cart-item">
                <div class="cart-item-image" style="${item.image ? '' : 'background: hsl(' + (Math.abs(item.name.length * 37) % 360) + ', 20%, 82%);'}">
                  ${item.image ? '<img src="' + item.image + '" alt="' + item.name + '">' : ''}
                </div>
                <div class="cart-item-info">
                  <p class="cart-item-name">${item.name}</p>
                  <p class="cart-item-meta">${item.size ? 'Size: ' + item.size + ' · ' : ''}Qty: ${item.quantity}</p>
                  <p class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</p>
                </div>
                <button class="cart-item-remove" onclick="removeCartItem(${i})">Remove</button>
              </div>
            `).join('')}
          </div>
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="cart-summary-row">
              <span>Subtotal</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="cart-summary-row">
              <span>Shipping</span>
              <span>${shipping === 0 ? 'Free' : '$' + shipping.toFixed(2)}</span>
            </div>
            <div class="cart-summary-row total">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <a href="/client/checkout.html" class="btn btn-primary btn-lg">Proceed to Checkout</a>
            <a href="/client/shop.html" class="btn btn-secondary" style="width:100%;margin-top:var(--space-sm);">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    function removeCartItem(index) {
      const cart = getCart();
      cart.splice(index, 1);
      localStorage.setItem('nodalis_cart', JSON.stringify(cart));
      updateCartCount();
      renderCartPage();
      showToast('Item removed from cart', 'success');
    }
  </script>
</body>
</html>
